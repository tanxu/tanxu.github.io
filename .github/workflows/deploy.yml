name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# GitHub Pages 部署所需权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署，新的推送取消进行中的任务
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # pnpm 必须在 setup-node 之前安装：setup-node 的 cache: pnpm 需要先找到 pnpm。
      # 这里不写 version，版本由根 package.json 的 packageManager 字段决定，
      # 保证 CI 与本地开发使用同一个 pnpm 版本。
      - name: 安装 pnpm
        uses: pnpm/action-setup@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # 锁定文件必须随代码提交，--frozen-lockfile 保证 CI 不会静默升级依赖
      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm run typecheck

      - name: 构建（Shell + 三个子应用合并产物到 dist/）
        run: pnpm run build

      # enablement: 若仓库尚未启用 Pages，自动以「GitHub Actions」模式启用，
      # 避免首次部署因 Pages 未开启而失败。
      # 注意：若 Pages 已启用且来源是「Deploy from a branch」，本步骤不会改动来源，
      # 需在 Settings → Pages → Source 手动切换为 GitHub Actions（见 README 第 7 节）。
      - name: 配置 Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: 上传产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
