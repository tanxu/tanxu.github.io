name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# GitHub Pages 部署所需权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署，新的推送取消进行中的任务
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 若改用 pnpm：删掉本步骤前的 setup-node cache 改为 pnpm，
      # 并加 `pnpm/action-setup@v4`，随后把 npm run 换成 pnpm。
      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 构建（Shell + 三个子应用合并产物到 dist/）
        run: npm run build

      # enablement: 若仓库尚未启用 Pages，自动以「GitHub Actions」模式启用，
      # 避免首次部署因 Pages 未开启而失败。
      # 注意：若 Pages 已启用且来源是「Deploy from a branch」，本步骤不会改动来源，
      # 需在 Settings → Pages → Source 手动切换为 GitHub Actions（见 README 第 7 节）。
      - name: 配置 Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: 上传产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
