<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>沙盒 · 独立子站</title>
    <meta name="description" content="部署在站点根目录 what-ever/ 下的独立页面，含 Canvas 动画与交互演示" />
    <style>
      :root { color-scheme: dark; --line: #2a3038; --muted: #8b949e; --accent: #58a6ff; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: #0d1117;
        color: #e6edf3;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        font-size: 14px;
        line-height: 1.7;
        -webkit-font-smoothing: antialiased;
      }
      .wrap { max-width: 760px; margin: 0 auto; padding: 0 22px 60px; }
      header { display: flex; align-items: baseline; gap: 14px; padding: 24px 0 16px; border-bottom: 1px solid var(--line); }
      h1 { margin: 0; font-size: 18px; font-weight: 500; letter-spacing: 0.02em; }
      .path { margin-left: auto; color: var(--muted); font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; }
      .back { color: var(--accent); font-size: 13px; text-decoration: none; }
      .back:hover { text-decoration: underline; }
      canvas { display: block; width: 100%; height: 260px; margin: 22px 0 18px; border: 1px solid var(--line); border-radius: 12px; background: #010409; cursor: crosshair; }
      .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
      .card { padding: 14px 16px; border: 1px solid var(--line); border-radius: 10px; background: #161b22; }
      .card h2 { margin: 0 0 4px; color: var(--muted); font-size: 11px; font-weight: 500; letter-spacing: 0.08em; }
      .big { font-size: 22px; font-weight: 500; font-variant-numeric: tabular-nums; }
      .btn {
        margin-top: 8px;
        padding: 4px 12px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: #21262d;
        color: #e6edf3;
        font: inherit;
        font-size: 12px;
        cursor: pointer;
      }
      .btn:hover { border-color: var(--accent); color: var(--accent); }
      footer { margin-top: 28px; padding-top: 18px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; }
      code { padding: 1px 5px; border-radius: 4px; background: #21262d; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; }
      @media (max-width: 620px) { .grid { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <h1>沙盒</h1>
        <a class="back" href="../">&larr; 返回主站</a>
        <span class="path">/what-ever/</span>
      </header>

      <p style="color: var(--muted)">把鼠标移到画布上 —— 粒子会被推开。没有任何依赖，纯原生实现。</p>

      <canvas id="field" aria-label="粒子波动画"></canvas>

      <div class="grid">
        <div class="card">
          <h2>本机时间</h2>
          <div class="big" id="clock">--:--:--</div>
        </div>
        <div class="card">
          <h2>点击次数</h2>
          <div class="big" id="count">0</div>
          <button class="btn" type="button" id="hit">点我 +1</button>
        </div>
        <div class="card">
          <h2>随机色</h2>
          <div class="big" id="swatch" style="height: 34px; border-radius: 6px; background: #21262d"></div>
          <button class="btn" type="button" id="roll">换一个</button>
        </div>
      </div>

      <footer>
        这个页面的源文件在 <code>sites/what-ever/index.html</code>，
        构建时被整目录复制到 <code>dist/what-ever/</code>，访问路径是 <code>&lt;站点根&gt;/what-ever/</code>。
        <br /><br />
        它和微前端的三个子应用是两套东西：那三个走 Shell 的装载器、跑在 ShadowRoot 里、共享事件总线；
        这个页面是浏览器直接加载的普通 HTML，Shell 完全不知道它存在。
      </footer>
    </div>

    <script>
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches
      const canvas = document.getElementById('field')
      const ctx = canvas.getContext('2d')
      const pointer = { x: -999, y: -999 }
      let dots = []

      function resize() {
        const dpr = window.devicePixelRatio || 1
        const rect = canvas.getBoundingClientRect()
        canvas.width = Math.round(rect.width * dpr)
        canvas.height = Math.round(rect.height * dpr)
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
        const cols = Math.max(12, Math.round(rect.width / 26))
        const rows = Math.max(6, Math.round(rect.height / 26))
        dots = []
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            dots.push({
              x: (rect.width / (cols - 1)) * c,
              y: (rect.height / (rows - 1)) * r,
              base: (c / (cols - 1) + r / (rows - 1)) * 2.2
            })
          }
        }
      }

      canvas.addEventListener('pointermove', (e) => {
        const rect = canvas.getBoundingClientRect()
        pointer.x = e.clientX - rect.left
        pointer.y = e.clientY - rect.top
      })
      canvas.addEventListener('pointerleave', () => {
        pointer.x = -999
        pointer.y = -999
      })

      function draw(t) {
        const rect = canvas.getBoundingClientRect()
        ctx.clearRect(0, 0, rect.width, rect.height)
        for (const d of dots) {
          const push = Math.hypot(d.x - pointer.x, d.y - pointer.y)
          const force = Math.max(0, 1 - push / 90)
          const angle = Math.atan2(d.y - pointer.y, d.x - pointer.x)
          const wave = Math.sin(d.base + t / 640) * 3
          const x = d.x + Math.cos(angle) * force * 26
          const y = d.y + Math.sin(angle) * force * 26 + wave
          const alpha = 0.18 + force * 0.72
          ctx.beginPath()
          ctx.arc(x, y, 1.5 + force * 1.9, 0, Math.PI * 2)
          ctx.fillStyle = force > 0.02 ? 'rgba(88,166,255,' + alpha + ')' : 'rgba(139,148,158,0.42)'
          ctx.fill()
        }
      }

      function loop(t) {
        draw(t)
        if (!reduceMotion) requestAnimationFrame(loop)
      }

      window.addEventListener('resize', () => {
        resize()
        if (reduceMotion) draw(0)
      })

      resize()
      if (reduceMotion) draw(0)
      else requestAnimationFrame(loop)

      const clock = document.getElementById('clock')
      setInterval(() => {
        clock.textContent = new Date().toLocaleTimeString('zh-CN', { hour12: false })
      }, 1000)
      clock.textContent = new Date().toLocaleTimeString('zh-CN', { hour12: false })

      let hits = 0
      const count = document.getElementById('count')
      document.getElementById('hit').addEventListener('click', () => {
        count.textContent = String(++hits)
      })

      const swatch = document.getElementById('swatch')
      document.getElementById('roll').addEventListener('click', () => {
        const hue = Math.floor(Math.random() * 360)
        swatch.style.background = 'hsl(' + hue + ' 72% 58%)'
      })
    </script>
  </body>
</html>
